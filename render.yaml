# Render.com 배포 설정 (https://render.com).
# render.com 에서 "New + → Blueprint" 로 이 저장소를 연결하면 자동 적용.
#
# plan 을 starter($7/월)로 설정 — 콜드 스타트(비활성 시 슬립) 없이 항상 켜져 있고,
# 영구 디스크도 지원돼서 세션 sqlite 가 재배포해도 안 날아감.
# ⚠️ 이 값이 대시보드에서 수동으로 바꾼 Compute Plan과 다르면, 다음 Blueprint 동기화 때
#    이 파일 값으로 덮어써질 수 있음 — 대시보드에서 플랜을 바꿨으면 항상 여기도 맞춰줄 것.
services:
  - type: web
    name: cheonmyeongjae-saju-chatbot
    runtime: python
    plan: starter
    buildCommand: pip install -r app/requirements.txt
    # gthread + threads=8: 요청 대부분이 Claude API 응답을 '기다리는' I/O 대기 시간이라
    # (CPU 계산은 짧음), 동기 워커 1개보다 스레드로 동시 처리하는 게 이 워크로드에 훨씬 유리함.
    # 워커 프로세스는 1개로 유지(메모리 절약, sqlite 단일 프로세스 접근이 더 단순).
    startCommand: gunicorn --chdir app server:app --worker-class gthread --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    disk:
      name: session-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false                # 대시보드에서 직접 입력
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5     # haiku보다 안정적(오류 빈도 낮음). 비용 차이는 미미함
      - key: WEBHOOK_SECRET
        generateValue: true        # 랜덤 생성 → 매니챗 헤더에 복사
      - key: SESSION_DB
        value: /var/data/sessions.db   # 영구 디스크 경로 (재배포/재시작해도 대화기록 유지)
      - key: CHANNEL_NAME
        value: 천명재
      - key: MAX_FREE_TURNS
        value: "9999"          # 매니챗 Condition 분기(버튼 숨김)가 자동루프 버그를 일으켜서
                                # 당분간 턴 제한 비활성화 — 버튼은 항상 표시, 대신 항상 새로 계산된
                                # 추천질문 3개가 실리므로 예전처럼 필드값이 안 굳고 정상 동작함
