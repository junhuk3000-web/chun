# Render.com 배포 설정 (https://render.com — 무료 티어 가능, 비활성 시 슬립).
# render.com 에서 "New + → Blueprint" 로 이 저장소를 연결하면 자동 적용.
#
# 무료(free) 플랜은 영구 디스크를 지원하지 않아서 세션 sqlite 가 재배포/재시작 시
# 초기화된다 (MVP 테스트 단계엔 괜찮음). 실제 운영 들어가서 진행 중이던 대화가
# 안 끊기게 하려면 plan 을 starter($7/월)로 바꾸고 아래 disk 블록의 주석을 해제하세요.
services:
  - type: web
    name: cheonmyeongjae-saju-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r app/requirements.txt
    startCommand: gunicorn --chdir app server:app --workers 1 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    # disk:                         # ← starter 이상으로 올리면 이 4줄 주석 해제
    #   name: session-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false                # 대시보드에서 직접 입력
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: WEBHOOK_SECRET
        generateValue: true        # 랜덤 생성 → 매니챗 헤더에 복사
      - key: SESSION_DB
        value: sessions.db         # free 플랜: 앱 디렉터리에 저장(재배포 시 초기화됨)
      - key: CHANNEL_NAME
        value: 천명재
